<h2>NU.SY2026-27.1T</h2>

<label for="section">Select Course-Section:</label>
<select id="section">
  <option value="">-- Select Course-Section --</option>
  <option value="ENPHYS30-BSCE251P2">ENPHYS30-BSCE251P2</option>
</select>
<br><br>

<label for="studentNumber">Student Number:</label>
<input type="text" id="studentNumber" placeholder="Enter student number">
<br><br>

<button onclick="fetchScores()">View Scores and Running Grade</button>

<hr>

<div id="output"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdrytPE81w3Uy2v6X3cBfQvGlsmfvx0uNnZtOgUImDVA92_Xtpr6PGLyP6zkYMj-crKA/exec";

async function fetchScores() {
    const section = document.getElementById("section").value;
    const studentNumber = document.getElementById("studentNumber").value.trim();

    // Clear display area and show loading state
    document.getElementById("output").innerHTML = "Loading scores...";

    // 1. Corrected Validation (Returns inside the if-blocks)
    if (!section) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please select a section.</p>";
        return;
    }
    if (!studentNumber) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please enter your student number.</p>";
        return;
    }

    // 2. Fixed URL template literal string
    const url = `${API_URL}?section=${encodeURIComponent(section)}&student=${encodeURIComponent(studentNumber)}`;

    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error("Network response was not ok");
        }

        const data = await response.json();

        // 3. Fixed Error Handling syntax
        if (data.error) {
            document.getElementById("output").innerHTML = `<p style='color:red;'>${data.error}</p>`;
            return;
        }

        // 4. Fixed HTML Table Generation using backticks properly
        let html = "<table border='1' cellpadding='8' style='border-collapse:collapse;'>";
        html += "<tr><th>Field</th><th>Value</th></tr>";

        for (let key in data) {
            html += `<tr><td><strong>${key}</strong></td><td>${data[key]}</td></tr>`;
        }
        html += "</table>";
        
        document.getElementById("output").innerHTML = html;

    } catch (err) {
        // 5. Fixed Catch Block syntax
        document.getElementById("output").innerHTML = "<p style='color:red;'>Error fetching data. Please try again.</p>";
        console.error("Fetch Error:", err);
    }
}
</script>
