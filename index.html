<style>
  /* Rich NU Blue and Gold gradient background matching official imagery */
  body {
    background: linear-gradient(135deg, #1e3a8a 0%, #102a6b 50%, #cca323 100%);
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* White clean container layout to maintain perfect readability */
  .container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    max-width: 480px;
    width: 100%;
    color: #333333;
    text-align: center; /* Center-aligns headers and logo elements */
  }

  /* Brand Header Logo Box */
  .brand-header {
    margin-bottom: 25px;
  }

  .logo-img {
    width: 110px;
    height: auto;
    margin-bottom: 12px;
  }

  h2 {
    color: #1e3a8a; /* NU Blue Accent */
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 4px 0;
    letter-spacing: 0.5px;
  }

  .sub-header {
    color: #cca323; /* NU Gold Accent */
    font-size: 16px;
    font-weight: 700;
    text-transform: uppercase;
    margin: 0 0 15px 0;
    letter-spacing: 1px;
  }

  .divider-line {
    height: 3px;
    background: linear-gradient(to right, #1e3a8a, #cca323);
    border: none;
    margin: 0 auto 20px auto;
    width: 60%;
    border-radius: 2px;
  }

  /* Form Elements Restyling */
  label {
    font-weight: 600;
    color: #4a5568;
    display: block;
    text-align: left;
    margin-bottom: 8px;
    font-size: 14px;
  }

  select, input[type="text"] {
    width: 100%;
    padding: 11px;
    margin-bottom: 20px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
    background-color: #f8fafc;
    transition: border 0.2s ease;
  }

  select:focus, input[type="text"]:focus {
    outline: none;
    border-color: #1e3a8a;
    background-color: #ffffff;
  }

  /* Interactive View Button */
  button {
    width: 100%;
    background-color: #1e3a8a;
    color: white;
    padding: 13px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease, transform 0.1s ease;
  }

  button:hover {
    background-color: #102a6b;
  }

  button:active {
    transform: scale(0.99);
  }

  hr {
    border: 0;
    height: 1px;
    background: #e2e8f0;
    margin: 25px 0;
  }

  /* Output Table Design styling */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 14px;
    text-align: left;
  }

  th, td {
    border: 1px solid #e2e8f0;
    padding: 11px;
  }

  th {
    background-color: #f1f5f9;
    color: #1e3a8a;
    font-weight: 600;
  }
</style>

<div class="container">
  <!-- Brand Header Container Block -->
  <div class="brand-header">
    <img src="NUL-logo.png" alt="NUL Logo" class="logo-img">
    <h2>NU LAGUNA</h2>
    <div class="sub-header">SY 2026-2027 • 1T</div>
    <div class="divider-line"></div>
  </div>

  <label for="section">Select Course-Section:</label>
  <select id="section">
    <option value="">-- Select Course-Section --</option>
    <option value="ENPHYS30-BSCE251P2">ENPHYS30-BSCE251P2</option>
  </select>

  <label for="studentNumber">Student Number:</label>
  <input type="text" id="studentNumber" placeholder="Enter student number">

  <button onclick="fetchScores()">View Scores and Running Grade</button>

  <hr>

  <div id="output"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdrytPE81w3Uy2v6X3cBfQvGlsmfvx0uNnZtOgUImDVA92_Xtpr6PGLyP6zkYMj-crKA/exec";

async function fetchScores() {
    const section = document.getElementById("section").value;
    const studentNumber = document.getElementById("studentNumber").value.trim();

    // Clear display area and show loading state
    document.getElementById("output").innerHTML = "Loading scores...";

    // 1. Corrected Validation (Returns inside the if-blocks)
    if (!section) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please select a section.</p>";
        return;
    }
    if (!studentNumber) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please enter your student number.</p>";
        return;
    }

    // 2. Fixed URL template literal string
    const url = `${API_URL}?section=${encodeURIComponent(section)}&student=${encodeURIComponent(studentNumber)}`;

    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error("Network response was not ok");
        }

        const data = await response.json();

        // 3. Fixed Error Handling syntax
        if (data.error) {
            document.getElementById("output").innerHTML = `<p style='color:red;'>${data.error}</p>`;
            return;
        }

        // 4. Fixed HTML Table Generation using backticks properly
        let html = "<table border='1' cellpadding='8' style='border-collapse:collapse;'>";
        html += "<tr><th>Field</th><th>Value</th></tr>";

        for (let key in data) {
            html += `<tr><td><strong>${key}</strong></td><td>${data[key]}</td></tr>`;
        }
        html += "</table>";
        
        document.getElementById("output").innerHTML = html;

    } catch (err) {
        // 5. Fixed Catch Block syntax
        document.getElementById("output").innerHTML = "<p style='color:red;'>Error fetching data. Please try again.</p>";
        console.error("Fetch Error:", err);
    }
}
</script>
