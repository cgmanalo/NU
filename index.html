<style>
  /* Rich Blue and Gold diagonal gradient background */
  body {
    background: linear-gradient(135deg, #0a192f 0%, #1e3a8a 50%, #d4af37 100%);
    background-attachment: fixed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    box-sizing: border-box;
  }

  /* A clean container card to hold your content and maximize readability */
  .container {
    background-color: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    max-width: 500px;
    width: 100%;
    color: #333333;
  }

  h2 {
    color: #1e3a8a; /* Blue header */
    margin-top: 0;
    border-bottom: 3px solid #d4af37; /* Gold accent line under title */
    padding-bottom: 10px;
  }

  label {
    font-weight: 600;
    color: #4a5568;
    display: block;
    margin-bottom: 8px;
  }

  select, input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    box-sizing: border-box;
  }

  /* Custom styled view button */
  button {
    width: 100%;
    background-color: #1e3a8a;
    color: white;
    padding: 12px;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  button:hover {
    background-color: #1d4ed8;
  }

  hr {
    border: 0;
    height: 1px;
    background: #e2e8f0;
    margin: 25px 0;
  }

  /* Beautifully styled data table */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 15px;
  }

  th, td {
    border: 1px solid #e2e8f0;
    padding: 10px;
    text-align: left;
  }

  th {
    background-color: #f8fafc;
    color: #1e3a8a;
    font-weight: 600;
  }
</style>

<div class="container">
  <h2>NU.SY2026-27.1T</h2>

  <label for="section">Select Course-Section:</label>
  <select id="section">
    <option value="">-- Select Course-Section --</option>
    <option value="ENPHYS30-BSCE251P2">ENPHYS30-BSCE251P2</option>
  </select>

  <label for="studentNumber">Student Number:</label>
  <input type="text" id="studentNumber" placeholder="Enter student number">

  <button onclick="fetchScores()">View Scores and Running Grade</button>

  <hr>

  <div id="output"></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdrytPE81w3Uy2v6X3cBfQvGlsmfvx0uNnZtOgUImDVA92_Xtpr6PGLyP6zkYMj-crKA/exec";

async function fetchScores() {
    const section = document.getElementById("section").value;
    const studentNumber = document.getElementById("studentNumber").value.trim();

    // Clear display area and show loading state
    document.getElementById("output").innerHTML = "Loading scores...";

    // 1. Corrected Validation (Returns inside the if-blocks)
    if (!section) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please select a section.</p>";
        return;
    }
    if (!studentNumber) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please enter your student number.</p>";
        return;
    }

    // 2. Fixed URL template literal string
    const url = `${API_URL}?section=${encodeURIComponent(section)}&student=${encodeURIComponent(studentNumber)}`;

    try {
        const response = await fetch(url);
        
        if (!response.ok) {
            throw new Error("Network response was not ok");
        }

        const data = await response.json();

        // 3. Fixed Error Handling syntax
        if (data.error) {
            document.getElementById("output").innerHTML = `<p style='color:red;'>${data.error}</p>`;
            return;
        }

        // 4. Fixed HTML Table Generation using backticks properly
        let html = "<table border='1' cellpadding='8' style='border-collapse:collapse;'>";
        html += "<tr><th>Field</th><th>Value</th></tr>";

        for (let key in data) {
            html += `<tr><td><strong>${key}</strong></td><td>${data[key]}</td></tr>`;
        }
        html += "</table>";
        
        document.getElementById("output").innerHTML = html;

    } catch (err) {
        // 5. Fixed Catch Block syntax
        document.getElementById("output").innerHTML = "<p style='color:red;'>Error fetching data. Please try again.</p>";
        console.error("Fetch Error:", err);
    }
}
</script>
